# Linux x64 release builds of this fork: Vulkan and CUDA, with the web UI built from source.
# Runs on a push to the qsa-release-build branch (or by hand); the binaries are left as artifacts and the
# release itself is made from them by hand. Based on the ubuntu-vulkan / ubuntu-cuda jobs of release.yml.
name: QSA Linux release builds

on:
  push:
    branches:
      - qsa-release-build
  workflow_dispatch:

env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
  CMAKE_ARGS: "-DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=ON"

jobs:
  ui-build:
    uses: ./.github/workflows/ui-build.yml

  vulkan:
    needs: [ui-build]
    runs-on: ubuntu-22.04

    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download UI build
        uses: actions/download-artifact@v7
        with:
          name: llama-ui.zip
          path: tools/ui/dist

      - name: Dependencies
        run: |
          wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo apt-key add -
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt-get update -y
          sudo apt-get install -y build-essential mesa-vulkan-drivers vulkan-sdk libssl-dev

      - name: Build
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DGGML_BACKEND_DL=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU_ALL_VARIANTS=ON \
            -DGGML_VULKAN=ON \
            ${{ env.CMAKE_ARGS }}
          cmake --build build --config Release -j $(nproc)

      - name: Pack
        run: |
          cp LICENSE ./build/bin/
          tar -czvf qsa-llama-linux-x64-vulkan.tar.gz --transform "s,^\.,qsa-llama-linux-x64-vulkan," -C ./build/bin .

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: qsa-llama-linux-x64-vulkan
          path: qsa-llama-linux-x64-vulkan.tar.gz

  cuda:
    needs: [ui-build]
    runs-on: ubuntu-24.04
    # 12.8: the first CUDA with Blackwell (sm_120) device code
    container: nvidia/cuda:12.8.2-devel-ubuntu24.04

    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git

      - name: Clone
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Download UI build
        uses: actions/download-artifact@v7
        with:
          name: llama-ui.zip
          path: tools/ui/dist

      - name: Dependencies
        run: |
          apt-get install -y --no-install-recommends build-essential cmake ninja-build libssl-dev

      - name: Build
        # no CMAKE_CUDA_ARCHITECTURES: the broad default set from ggml/src/ggml-cuda/CMakeLists.txt
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DGGML_BACKEND_DL=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU_ALL_VARIANTS=ON \
            -DGGML_CUDA=ON \
            -DGGML_CUDA_NCCL=OFF \
            -DGGML_CUDA_CUB_3DOT2=ON \
            ${{ env.CMAKE_ARGS }}
          cmake --build build --config Release -j $(nproc)

      - name: Pack
        run: |
          cp LICENSE ./build/bin/
          tar -czvf qsa-llama-linux-x64-cuda-12.8.tar.gz --transform "s,^\.,qsa-llama-linux-x64-cuda-12.8," -C ./build/bin .
          # the CUDA runtime the backend links against, for machines with a driver but no toolkit:
          # extract next to the binaries ($ORIGIN rpath)
          mkdir -p cudart
          cp -L /usr/local/cuda/lib64/libcudart.so.12 /usr/local/cuda/lib64/libcublas.so.12 /usr/local/cuda/lib64/libcublasLt.so.12 cudart/
          tar -czvf cudart-12.8-linux-x64.tar.gz --transform "s,^\.,qsa-llama-linux-x64-cuda-12.8," -C ./cudart .

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: qsa-llama-linux-x64-cuda-12.8
          path: |
            qsa-llama-linux-x64-cuda-12.8.tar.gz
            cudart-12.8-linux-x64.tar.gz
